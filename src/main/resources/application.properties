spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/period_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}

# Comma-separated list. Set CORS_ALLOWED_ORIGINS on Render to your Vercel URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}
